name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: app/backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run unit tests
        env:
          JWT_SECRET: ci-test-secret-not-for-production
          SUPABASE_URL: https://placeholder.supabase.co
          SUPABASE_KEY: placeholder-key
        run: python -m unittest discover -s tests -v

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: app/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build production bundle
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: app/frontend/dist/
          retention-days: 7

  ml-pipeline:
    name: ML Pipeline Smoke Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: app/backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate training data
        run: python -m scripts.generate_training_data

      - name: Train model
        run: python -m scripts.train_model

      - name: Verify model artifacts exist
        run: |
          test -f app/ml/priority_model.pkl && echo "Model file OK"
          test -f app/ml/model_metrics.json && echo "Metrics file OK"
          python -c "
          import json
          with open('app/ml/model_metrics.json') as f:
              m = json.load(f)
          assert m['accuracy'] > 0.60, f'Accuracy too low: {m[\"accuracy\"]}'
          print(f'Model accuracy: {m[\"accuracy\"]:.4f} - PASS')
          "
