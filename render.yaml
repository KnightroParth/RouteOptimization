services:
  - type: web
    name: mr-route-api
    runtime: python
    buildCommand: pip install -r requirements.txt && python -m scripts.generate_training_data && python -m scripts.train_model
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    rootDir: app/backend
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: JWT_EXPIRATION_MINUTES
        value: "480"
      - key: CORS_ORIGINS
        sync: false
      - key: ORS_API_KEY
        sync: false
      - key: PYTHON_VERSION
        value: "3.12.0"
    healthCheckPath: /api/health
    autoDeploy: true
